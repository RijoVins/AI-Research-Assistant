[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-assistant"
version = "1.0.0"
description = "Chat with your PDFs: a retrieval-augmented generation (RAG) assistant with page-level citations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Rijo Vins" }]
keywords = ["rag", "llm", "langchain", "chromadb", "semantic-search", "streamlit"]
dependencies = [
    "chromadb>=1.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-chroma>=1.0",
    "langchain-groq>=1.0",
    "langchain-huggingface>=1.0",
    "langchain-text-splitters>=1.0",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
research-assistant = "ai_research_assistant.cli:main"

[project.urls]
Repository = "https://github.com/RijoVins/AI-Research-Assistant"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
